spring:
  application:
    name: template
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mydatabase}
    username: ${DATABASE_USERNAME:myuser}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 500ms
      timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
        delivery.timeout.ms: 8000
        request.timeout.ms: 3000
        max.block.ms: 3000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 20
      properties:
        max.poll.interval.ms: 300000
    template:
      observation-enabled: true
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:false}
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    path: /swagger-ui.html
    persist-authorization: false
app:
  customer:
    cache:
      ttl: ${CUSTOMER_CACHE_TTL:PT1M}
    outbox:
      poll-ms: ${CUSTOMER_OUTBOX_POLL_MS:500}
      max-attempts: ${CUSTOMER_OUTBOX_MAX_ATTEMPTS:10}
    consumer:
      backoff-ms: ${CUSTOMER_CONSUMER_BACKOFF_MS:1000}
    consumers:
      enabled: true
    jobs:
      enabled: true
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:template}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# PostgreSQL constraint messages may echo personal key values (including email).
# Adapters translate known conflicts and expose safe counters instead.
logging:
  level:
    org.hibernate.orm.jdbc.error: "OFF"
