spring:
  application:
    name: template
  r2dbc:
    url: ${DATABASE_URL:r2dbc:postgresql://localhost:5432/mydatabase}
    username: ${DATABASE_USERNAME:myuser}
    password: ${DATABASE_PASSWORD}
    pool:
      initial-size: 0
      max-size: ${DATABASE_POOL_SIZE:10}
      max-acquire-time: 5s
  flyway:
    url: ${FLYWAY_DATABASE_URL:jdbc:postgresql://localhost:5432/mydatabase}
    user: ${DATABASE_USERNAME:myuser}
    password: ${DATABASE_PASSWORD}
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 500ms
      timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
        delivery.timeout.ms: 8000
        request.timeout.ms: 3000
        max.block.ms: 3000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 1 # One in-flight record per consumer preserves partition order.
      properties:
        max.poll.interval.ms: 300000
    template:
      observation-enabled: true
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:false}
  webflux:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    path: /swagger-ui.html
    persist-authorization: false
app:
  customer:
    cache:
      ttl: ${CUSTOMER_CACHE_TTL:PT1M}
    outbox:
      poll-ms: ${CUSTOMER_OUTBOX_POLL_MS:500}
      max-attempts: ${CUSTOMER_OUTBOX_MAX_ATTEMPTS:10}
    consumer:
      backoff-ms: ${CUSTOMER_CONSUMER_BACKOFF_MS:1000}
    consumers:
      enabled: true
    jobs:
      enabled: true
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:template}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# Avoid driver error DETAIL and SQL parameter logs containing personal values.
logging:
  level:
    io.r2dbc.postgresql.client: "OFF"
