import javax.xml.parsers.DocumentBuilderFactory
import java.math.RoundingMode

plugins {
    id 'jacoco'
    id 'org.jetbrains.kotlin.jvm' version '2.3.21'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.3.21'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.graalvm.buildtools.native' version '1.1.8'
    id 'org.asciidoctor.jvm.convert' version '4.0.5'
}

group = 'com.kotlin'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('snippetsDir', file("build/generated-snippets"))
    // Security overrides until Spring Boot's BOM includes these patched releases.
    set('jackson-bom.version', '3.1.7')
    set('jackson-2-bom.version', '2.21.7')
    // Validation still uses Tomcat EL; the HTTP server is Reactor Netty.
    set('tomcat.version', '11.0.26')
    set('logback.version', '1.6.3')
}

dependencies {
    constraints {
        implementation('com.github.luben:zstd-jni:1.5.7-14') {
            because 'Fix native bounds checks and dictionary use-after-free (CVE-2026-87795 and related CVEs)'
        }
        implementation('at.yawk.lz4:lz4-java:1.11.1') {
            because 'Fix native XXHash range validation (CVE-2026-59949)'
        }
    }
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'com.fasterxml.uuid:java-uuid-generator:5.1.0'
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:3.1.0'
    implementation 'tools.jackson.module:jackson-module-kotlin'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    runtimeOnly 'org.postgresql:postgresql' // Flyway startup migrations only
    implementation 'org.postgresql:r2dbc-postgresql'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.testcontainers:testcontainers-r2dbc'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-r2dbc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    // Kafka integration tests use Testcontainers, so no embedded broker/test starter is needed.
    testImplementation 'org.springframework.boot:spring-boot-starter-restdocs'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'io.rest-assured:rest-assured:6.0.1'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testImplementation 'org.springframework.restdocs:spring-restdocs-webtestclient'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-kafka'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
    }
}

tasks.named('test') {
    outputs.dir snippetsDir
    useJUnitPlatform()
}

tasks.named('asciidoctor') {
    inputs.dir snippetsDir
    dependsOn test
}

// Measure all production classes, including infrastructure; do not hide uncovered code.
jacoco {
    toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        html.required = true
        xml.required = true
        csv.required = true
    }
}

tasks.register('coverageBadge') {
    group = 'verification'
    description = 'Updates the README badge from full-suite JaCoCo line coverage.'
    dependsOn tasks.named('jacocoTestReport')
    inputs.file(layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml'))
    outputs.file(layout.projectDirectory.file('docs/assets/coverage.svg'))
    doLast {
        def testFilter = tasks.named('test').get().filter
        if (!testFilter.includePatterns.empty || !testFilter.commandLineIncludePatterns.empty) {
            throw new GradleException('Generate the badge with ./gradlew coverage and no --tests filter.')
        }
        def factory = DocumentBuilderFactory.newInstance()
        // Parser feature identifiers are exact URIs, not URLs to upgrade to HTTPS.
        factory.setFeature('http://apache.org/xml/features/nonvalidating/load-external-dtd', false)
        factory.setFeature('http://xml.org/sax/features/external-general-entities', false)
        factory.setFeature('http://xml.org/sax/features/external-parameter-entities', false)
        def report = factory.newDocumentBuilder().parse(inputs.files.singleFile)
        def counter = (0..<report.documentElement.childNodes.length)
                .collect { report.documentElement.childNodes.item(it) }
                .find { it.nodeName == 'counter' && it.getAttribute('type') == 'LINE' }
        if (counter == null) throw new GradleException('JaCoCo report has no line counter.')
        def covered = counter.getAttribute('covered').toLong()
        def missed = counter.getAttribute('missed').toLong()
        if (covered + missed == 0) throw new GradleException('JaCoCo report contains no production lines.')
        def percentage = (covered * 100.0G / (covered + missed)).setScale(1, RoundingMode.HALF_UP)
        def color = percentage >= 90 ? '#4c1' : percentage >= 80 ? '#dfb317' : '#fe7d37'
        def badge = outputs.files.singleFile
        badge.parentFile.mkdirs()
        badge.text = """<svg xmlns="http://www.w3.org/2000/svg" width="150" height="20" role="img" aria-label="line coverage: ${percentage}%">
  <title>Line coverage: ${percentage}% (${covered}/${covered + missed} lines)</title>
  <clipPath id="round"><rect width="150" height="20" rx="3"/></clipPath>
  <g clip-path="url(#round)"><rect width="91" height="20" fill="#555"/><rect x="91" width="59" height="20" fill="${color}"/></g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11">
    <text x="45.5" y="14">line coverage</text><text x="120.5" y="14">${percentage}%</text>
  </g>
</svg>
"""
        logger.lifecycle("Line coverage: {}% ({}/{}); badge: {}", percentage, covered, covered + missed, badge)
    }
}

tasks.register('coverage') {
    group = 'verification'
    description = 'Runs all tests, creates HTML/XML/CSV coverage reports and refreshes the README badge.'
    dependsOn tasks.named('coverageBadge')
}
